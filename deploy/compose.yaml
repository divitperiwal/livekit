# Production: one Droplet in DigitalOcean BLR1. Variables come from .env (see .env.example).
# Deploy with ./deploy.sh, not `docker compose up`: the workers must restart one at a time.
name: automitra

x-logging: &logging
  driver: json-file
  options:
    max-size: 50m
    max-file: "3"

x-database-url: &database-url postgres://automitra:${POSTGRES_PASSWORD:?}@postgres:5432/automitra

x-recording-storage: &recording-storage
  RECORDING_S3_BUCKET: ${RECORDING_S3_BUCKET:?}
  RECORDING_S3_REGION: ${RECORDING_S3_REGION:?}
  RECORDING_S3_ENDPOINT: ${RECORDING_S3_ENDPOINT:?}
  RECORDING_S3_ACCESS_KEY: ${RECORDING_S3_ACCESS_KEY:?}
  RECORDING_S3_SECRET_KEY: ${RECORDING_S3_SECRET_KEY:?}

x-livekit: &livekit
  LIVEKIT_URL: ${LIVEKIT_URL:?}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
  TELEPHONY_AGENT_NAME: ${TELEPHONY_AGENT_NAME:?}

# Each image is built by one service only (api, worker-a) and reused by the other:
# two builds of one tag give it a new id, which would restart its containers on every deploy.
x-api-image: &api-image
  image: automitra-api
  pull_policy: never
  restart: unless-stopped
  init: true
  logging: *logging
  depends_on:
    postgres:
      condition: service_healthy

x-worker: &worker
  image: automitra-worker
  pull_policy: never
  restart: unless-stopped
  init: true
  logging: *logging
  # A stop drains: no new calls, and live ones run to the end, recording upload and
  # analysis included. deploy.sh checks this covers TELEPHONY_MAX_CALL_SECONDS.
  stop_grace_period: ${WORKER_STOP_GRACE_SECONDS:?}s
  depends_on:
    api:
      condition: service_healthy
  environment:
    <<: [*livekit, *recording-storage]
    SARVAM_API_KEY: ${SARVAM_API_KEY:?}
    CONTROL_PLANE_URL: http://api:3000
    INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?}
    TELEPHONY_ENABLED: "true"
    TELEPHONY_MAX_CALL_SECONDS: ${TELEPHONY_MAX_CALL_SECONDS:?}
    PLIVO_PHONE_NUMBERS: ${PLIVO_PHONE_NUMBERS:?}
    PLIVO_SIP_USERNAME: ${PLIVO_SIP_USERNAME:-}
    PLIVO_SIP_PASSWORD: ${PLIVO_SIP_PASSWORD:-}
    PLIVO_ALLOWED_ADDRESSES: ${PLIVO_ALLOWED_ADDRESSES:-}
  healthcheck:
    test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8081/', timeout=3)
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 60s

services:
  postgres:
    build: postgres
    image: automitra-postgres
    restart: unless-stopped
    logging: *logging
    shm_size: 256mb
    stop_grace_period: 60s
    # Every WAL segment goes to Spaces within a minute, so a lost Droplet loses at most
    # a minute of billing data. Base backups: backup.sh.
    command:
      - postgres
      - -c
      - archive_mode=on
      - -c
      - archive_command=pgbackrest archive-push %p
      - -c
      - archive_timeout=60
    environment:
      POSTGRES_USER: automitra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: automitra
      PGBACKREST_STANZA: main
      PGBACKREST_PG1_PATH: /var/lib/postgresql/data
      PGBACKREST_PG1_USER: automitra
      PGBACKREST_REPO1_TYPE: s3
      PGBACKREST_REPO1_PATH: /pgbackrest
      PGBACKREST_REPO1_S3_BUCKET: ${BACKUP_S3_BUCKET:?}
      PGBACKREST_REPO1_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:?}
      PGBACKREST_REPO1_S3_REGION: ${BACKUP_S3_REGION:?}
      PGBACKREST_REPO1_S3_KEY: ${BACKUP_S3_ACCESS_KEY:?}
      PGBACKREST_REPO1_S3_KEY_SECRET: ${BACKUP_S3_SECRET_KEY:?}
      PGBACKREST_REPO1_CIPHER_TYPE: aes-256-cbc
      PGBACKREST_REPO1_CIPHER_PASS: ${BACKUP_ENCRYPTION_PASSPHRASE:?}
      PGBACKREST_REPO1_RETENTION_FULL: "2"
      PGBACKREST_COMPRESS_TYPE: zst
      PGBACKREST_START_FAST: "y"
      PGBACKREST_LOG_LEVEL_FILE: "off"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "--username=automitra", "--dbname=automitra"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    <<: *api-image
    build:
      context: ..
      dockerfile: api/Dockerfile
    stop_grace_period: 30s
    environment:
      <<: *livekit
      NODE_ENV: production
      DATABASE_URL: *database-url
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?}
      SECRETS_KEY: ${SECRETS_KEY:?}
    # Any HTTP answer, even a 404, means the server is up.
    healthcheck:
      test: ["CMD", "bun", "--eval", "await fetch('http://localhost:3000/')"]
      interval: 5s
      timeout: 5s
      retries: 10

  background:
    <<: *api-image
    command: ["bun", "src/background.ts"]
    stop_grace_period: 30s
    environment:
      <<: *recording-storage
      DATABASE_URL: *database-url
      SECRETS_KEY: ${SECRETS_KEY:?}
      TELEPHONY_MAX_CALL_SECONDS: ${TELEPHONY_MAX_CALL_SECONDS:?}

  worker-a:
    <<: *worker
    build: ../worker
  worker-b: *worker

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
