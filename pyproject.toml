# The root is a workspace coordinator, not a package: it has no [project]
# table, so there is nothing here to build or install. Everything installable
# lives in a member below.

[tool.uv.workspace]
members = ["worker"]

[tool.uv.sources]
automitra-worker = { workspace = true }

[dependency-groups]
dev = [
    "automitra-worker",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["worker/tests"]
asyncio_mode = "auto"
