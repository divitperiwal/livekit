[project]
name = "automitra-worker"
version = "0.1.0"
description = "Runs live automitra calls on LiveKit Agents with Sarvam speech-to-text, LLM and voice."
requires-python = ">=3.13,<3.14"
dependencies = [
    "livekit-agents[silero,turn-detector]~=1.8",
    "livekit-plugins-sarvam~=1.8",
    "pydantic>=2.11,<3",
    "python-dotenv>=1.2",
    "tzdata",
]

[project.scripts]
agent = "automitra_worker.entrypoint:main"
costs = "automitra_worker.cost.costs_cli:main"
telephony = "automitra_worker.telephony.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.16.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/automitra_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
