services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: automitra
      POSTGRES_PASSWORD: automitra
      POSTGRES_DB: automitra
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: automitra
      MINIO_ROOT_PASSWORD: automitra-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

volumes:
  postgres-data:
  minio-data:
