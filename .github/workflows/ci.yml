# Both test suites, formatting, types and schema drift on every push and pull request, and
# every migration applied to a real Postgres 16 (PGlite misses some of its rules).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run test
      - name: Migrations match the schema
        run: |
          bunx drizzle-kit generate --name schema-drift
          test -z "$(git status --porcelain -- drizzle)"

  api-migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: automitra
          POSTGRES_PASSWORD: automitra
          POSTGRES_DB: automitra
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready --username=automitra --dbname=automitra"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
        env:
          DATABASE_URL: postgres://automitra:automitra@localhost:5432/automitra

  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.13
      - run: uv sync --locked
      - run: uv run ruff format --check src tests
      - run: uv run pytest
      - name: Committed schemas match the worker
        run: uv run python -m automitra_worker.agent_config.export_schema --check
